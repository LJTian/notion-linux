<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notion Tab Sketch A</title>
    <style>
      :root {
        --bg: #f7f6f3;
        --line: #e8e6e3;
        --text: #2f2f2f;
        --muted: #6b6b6b;
        --hover: #efede9;
        --active-border: #d9d5cf;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Noto Sans CJK SC", sans-serif;
        background: #eceae5;
        color: var(--text);
      }

      .window {
        width: min(1320px, 96vw);
        height: min(780px, 92vh);
        margin: 20px auto;
        border: 1px solid #ddd8d1;
        border-radius: 12px;
        overflow: hidden;
        background: #fff;
      }

      .tabbar {
        height: 42px;
        display: flex;
        align-items: center;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        padding: 0 8px;
        gap: 8px;
      }

      .tabs {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        flex: 1;
      }

      .tab {
        min-width: 120px;
        max-width: 220px;
        height: 30px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
        border-radius: 8px;
        border: 1px solid transparent;
        color: var(--muted);
        background: transparent;
      }

      .tab:hover { background: var(--hover); }

      .tab.active {
        color: var(--text);
        background: #fff;
        border-color: var(--active-border);
      }

      .tab-title {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 13px;
        line-height: 1;
      }

      .tab-close {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: #8a8a8a;
      }

      .tab:hover .tab-close,
      .tab.active .tab-close { background: #f0efec; }

      .new-tab {
        width: 24px;
        height: 24px;
        border: 1px solid #d7d3cc;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #525252;
        font-size: 16px;
        line-height: 1;
      }

      .content {
        height: calc(100% - 42px);
        background: #fff;
        display: grid;
        place-items: center;
      }

      .notion-page {
        width: min(920px, 92%);
        height: min(560px, 92%);
        border-radius: 10px;
        border: 1px solid #f0efec;
        background: #fff;
        padding: 28px 34px;
      }

      .crumb {
        color: #9a9a9a;
        font-size: 12px;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0 0 14px;
        font-size: 28px;
        font-weight: 600;
      }

      .line {
        height: 12px;
        background: #f6f5f2;
        border-radius: 6px;
        margin: 12px 0;
      }

      .w1 { width: 62%; }
      .w2 { width: 78%; }
      .w3 { width: 48%; }
      .w4 { width: 70%; }
      .w5 { width: 54%; }
    </style>
  </head>
  <body>
    <div class="window">
      <header class="tabbar">
        <div class="tabs">
          <div class="tab"><span class="tab-title">周报</span><span class="tab-close">×</span></div>
          <div class="tab"><span class="tab-title">MVP 构建</span><span class="tab-close">×</span></div>
          <div class="tab"><span class="tab-title">公安部三所</span><span class="tab-close">×</span></div>
          <div class="tab active"><span class="tab-title">To-do table</span><span class="tab-close">×</span></div>
        </div>
        <div class="new-tab">+</div>
      </header>

      <main class="content">
        <section class="notion-page">
          <div class="crumb">统计软件技术公司 / 周报 / 2026 上半年</div>
          <h1>新一代云桌面项目</h1>
          <div class="line w2"></div>
          <div class="line w1"></div>
          <div class="line w4"></div>
          <div class="line w3"></div>
          <div class="line w5"></div>
        </section>
      </main>
    </div>
  </body>
</html>
